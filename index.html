<script>

	function redirect()
	{
		language = (navigator.language || navigator.userLanguage || 'en').substring(0,2);
		
		if (language == 'ru')
			window.location = 'index_ru.html';
		else
			window.location = 'index_en.html';
	}
	
</script>
